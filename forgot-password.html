<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - S K Ismail Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lamp-style.css">
</head>
<body>
  <!-- Ambient Room Background -->
  <main class="room" id="room">
    <!-- Background Elements -->
    <div class="night-sky">
      <div class="stars-cluster"></div>
      <div class="ambient-window">
        <div class="window-frame"></div>
        <div class="window-pane">
          <div class="window-glow"></div>
        </div>
      </div>
    </div>

    <div class="room-light" id="roomLight"></div>
    <div class="fireflies" id="fireflies"></div>

    <!-- Top Controls: Sound Toggle -->
    <header class="top-controls">
      <!-- Sound FX Toggle -->
      <button class="sound-toggle" id="soundToggle" aria-label="Toggle Sound Effects" title="Sound Effects (ON/OFF)">
        <svg class="sound-icon sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"></path>
        </svg>
        <svg class="sound-icon sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </header>

    <!-- Interactive Lamp Area -->
    <section class="lamp-side">
      <div class="lamp-container" id="lampContainer">
        <div class="lamp-glow"></div>
        
        <!-- Lamp Head Assembly -->
        <div class="lamp-top-finial"></div>
        <div class="lamp-head" id="lampHead">
          <div class="lamp-inner-bulb"></div>
        </div>
        
        <!-- Dynamic Volumetric Light Beam -->
        <div class="light-beam" id="lightBeam">
          <div class="dust-motes"></div>
        </div>

        <!-- Lamp Hardware -->
        <div class="lamp-neck-joint"></div>
        <div class="lamp-stem"></div>
        <div class="lamp-joint"></div>
        <div class="lamp-base">
          <div class="base-ridge"></div>
        </div>
        <div class="desk-surface" id="deskSurface"></div>

        <!-- Dynamic String with SVG physics path -->
        <svg class="string-svg" aria-hidden="true">
          <path id="stringPath" d="M 0 0 L 0 95"></path>
        </svg>

        <!-- Pull Switch Handle -->
        <div class="string-handle" id="stringHandle" aria-label="Pull lamp switch string" tabindex="0">
          <div class="handle-bead"></div>
        </div>
      </div>

      <!-- Glowing Signature Name -->
      <div class="lamp-signature" aria-hidden="true">
        <span class="sig-text">Shaikh Ismail</span>
        <span class="sig-underline"></span>
      </div>
    </section>

    <!-- Glassmorphic Authentication Card -->
    <section class="login-side">
      <div class="login-card glass" id="loginCard">
        <div class="card-glow-overlay" id="cardGlow"></div>
        <div class="glass-line"></div>

        <!-- Card Header -->
        <div class="login-heading">
          <h2 id="headingTitle">Forgot Password</h2>
          <p id="headingSub">Enter your email to receive OTP for password reset</p>
        </div>

        <!-- Form Elements -->
        <form class="auth-form" id="forgotForm" autocomplete="on">
          <div class="inputs">
            <!-- Email Address -->
            <label class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input type="email" id="emailInput" placeholder="Email Address" required autocomplete="email">
            </label>
          </div>

          <!-- Submit Button -->
          <button class="sign-in-btn" id="submitBtn" type="submit">
            <span class="btn-text" id="btnText">Send OTP</span>
            <div class="btn-loader hidden" id="btnLoader">
              <span class="spinner"></span>
            </div>
          </button>

          <!-- Back to Login -->
          <div class="options-row" style="margin-top: 20px;">
            <a href="/admin/login" class="forgot-link">← Back to Login</a>
          </div>
        </form>

        <!-- Notification / Toast Feedback -->
        <div class="feedback-toast" id="feedbackToast">
          <span class="toast-icon">✨</span>
          <span class="toast-text" id="toastText">Welcome back! Access granted.</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/lamp-script.js"></script>
  <script>
    // Forgot Password Form Handler
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('emailInput').value.trim();
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');
      const submitBtn = document.getElementById('submitBtn');
      const loginCard = document.getElementById('loginCard');

      if (!email) {
        loginCard.classList.add('shake');
        showToast('Please enter your email address', 'error');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      btnText.classList.add('hidden');
      btnLoader.classList.remove('hidden');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
          credentials: 'include'
        });

        const data = await response.json();

        btnText.classList.remove('hidden');
        btnLoader.classList.add('hidden');
        submitBtn.disabled = false;

        if (response.ok) {
          playSound('success');
          showToast('OTP sent to your email!', 'success');
          setTimeout(() => {
            window.location.href = '/admin/otp-verification.html?email=' + encodeURIComponent(email);
          }, 1500);
        } else {
          loginCard.classList.add('shake');
          showToast(data.message || 'Failed to send OTP', 'error');
          setTimeout(() => loginCard.classList.remove('shake'), 500);
        }
      } catch (error) {
        btnText.classList.remove('hidden');
        btnLoader.classList.add('hidden');
        submitBtn.disabled = false;
        loginCard.classList.add('shake');
        showToast('Network error. Please try again.', 'error');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
      }
    });
  </script>
</body>
</html>
