<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - S K Ismail Portfolio</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .reset-header p {
            color: #666;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .reset-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .reset-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .reset-links a:hover {
            text-decoration: underline;
        }

        .notification {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .notification.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .notification.show {
            display: block;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .otp-info {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>Reset Password</h1>
            <p>Recover your admin account access</p>
        </div>

        <div class="notification" id="notification"></div>

        <!-- Step 1: Request OTP -->
        <div class="step active" id="step1">
            <form id="otpRequestForm">
                <div class="form-group">
                    <label for="identifier">Username, Email, or Phone</label>
                    <input type="text" id="identifier" name="identifier" placeholder="Enter your username, email, or phone" required>
                </div>

                <div class="form-group">
                    <label for="method">Send OTP via</label>
                    <select id="method" name="method">
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Send OTP</button>
            </form>
        </div>

        <!-- Step 2: Verify OTP -->
        <div class="step" id="step2">
            <form id="otpVerifyForm">
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" placeholder="Enter the 6-digit OTP" maxlength="6" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password (min 6 characters)" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>

            <div class="otp-info" id="otpInfo"></div>

            <button class="btn btn-secondary" onclick="goToStep(1)">Back</button>
        </div>

        <!-- Step 3: Success -->
        <div class="step" id="step3">
            <div style="text-align: center;">
                <i class="fas fa-check-circle" style="font-size: 4rem; color: #10b981; margin-bottom: 1rem;"></i>
                <h2 style="margin-bottom: 1rem;">Password Reset Successful!</h2>
                <p style="color: #666; margin-bottom: 2rem;">Your password has been updated successfully.</p>
                <button class="btn btn-primary" onclick="window.location.href='admin-login.html'">Go to Login</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <div class="reset-links">
            <p>Remember your password? <a href="admin-login.html">Back to Login</a></p>
        </div>
    </div>

    <script>
        const API_BASE = 'https://skismail-portfolio.onrender.com/api';

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        function goToStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('show');
            } else {
                loading.classList.remove('show');
            }
        }

        // Step 1: Request OTP
        document.getElementById('otpRequestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value;
            const method = document.getElementById('method').value;
            
            if (!identifier) {
                showNotification('Please enter your identifier', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, method })
                });

                const data = await response.json();
                showLoading(false);

                if (data.success) {
                    showNotification(data.message, 'success');
                    
                    // Redirect to OTP verification page
                    const redirectUrl = `https://skismail-portfolio.onrender.com/admin/otp-verification?identifier=${encodeURIComponent(identifier)}&email=${encodeURIComponent(data.email)}`;
                    window.location.href = redirectUrl;
                } else {
                    showNotification(data.error || 'Failed to send OTP', 'error');
                }
            } catch (error) {
                showLoading(false);
                showNotification('Connection error. Is the server running?', 'error');
            }
        });

        // Step 2: Verify OTP and Reset Password
        document.getElementById('otpVerifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value;
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!identifier || !otp || !newPassword || !confirmPassword) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, otp, newPassword })
                });

                const data = await response.json();
                showLoading(false);

                if (data.success) {
                    showNotification(data.message, 'success');
                    goToStep(3);
                } else {
                    showNotification(data.error || 'Failed to reset password', 'error');
                }
            } catch (error) {
                showLoading(false);
                showNotification('Connection error. Is the server running?', 'error');
            }
        });
    </script>
</body>
</html>
