<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - S K Ismail Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lamp-style.css">
</head>
<body>
  <!-- Ambient Room Background -->
  <main class="room" id="room">
    <!-- Background Elements -->
    <div class="night-sky">
      <div class="stars-cluster"></div>
      <div class="ambient-window">
        <div class="window-frame"></div>
        <div class="window-pane">
          <div class="window-glow"></div>
        </div>
      </div>
    </div>

    <div class="room-light" id="roomLight"></div>
    <div class="fireflies" id="fireflies"></div>

    <!-- Top Controls: Sound Toggle -->
    <header class="top-controls">
      <!-- Sound FX Toggle -->
      <button class="sound-toggle" id="soundToggle" aria-label="Toggle Sound Effects" title="Sound Effects (ON/OFF)">
        <svg class="sound-icon sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"></path>
        </svg>
        <svg class="sound-icon sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </header>

    <!-- Interactive Lamp Area -->
    <section class="lamp-side">
      <div class="lamp-container" id="lampContainer">
        <div class="lamp-glow"></div>
        
        <!-- Lamp Head Assembly -->
        <div class="lamp-top-finial"></div>
        <div class="lamp-head" id="lampHead">
          <div class="lamp-inner-bulb"></div>
        </div>
        
        <!-- Dynamic Volumetric Light Beam -->
        <div class="light-beam" id="lightBeam">
          <div class="dust-motes"></div>
        </div>

        <!-- Lamp Hardware -->
        <div class="lamp-neck-joint"></div>
        <div class="lamp-stem"></div>
        <div class="lamp-joint"></div>
        <div class="lamp-base">
          <div class="base-ridge"></div>
        </div>
        <div class="desk-surface" id="deskSurface"></div>

        <!-- Dynamic String with SVG physics path -->
        <svg class="string-svg" aria-hidden="true">
          <path id="stringPath" d="M 0 0 L 0 95"></path>
        </svg>

        <!-- Pull Switch Handle -->
        <div class="string-handle" id="stringHandle" aria-label="Pull lamp switch string" tabindex="0">
          <div class="handle-bead"></div>
        </div>
      </div>

      <!-- Glowing Signature Name -->
      <div class="lamp-signature" aria-hidden="true">
        <span class="sig-text">Shaikh Ismail</span>
        <span class="sig-underline"></span>
      </div>
    </section>

    <!-- Glassmorphic Authentication Card -->
    <section class="login-side">
      <div class="login-card glass" id="loginCard">
        <div class="card-glow-overlay" id="cardGlow"></div>
        <div class="glass-line"></div>

        <!-- Form Switcher Tabs -->
        <div class="form-tabs" role="tablist">
          <div class="tab-slider" id="tabSlider"></div>
          <button class="tab-btn active" id="tabSignIn" type="button" role="tab" aria-selected="true">Sign In</button>
          <button class="tab-btn" id="tabSignUp" type="button" role="tab" aria-selected="false">Create Account</button>
        </div>

        <!-- Card Header -->
        <div class="login-heading">
          <h2 id="headingTitle">Set New Password</h2>
          <p id="headingSub">Create a strong new password for your account</p>
        </div>

        <!-- Form Elements -->
        <form class="auth-form" id="passwordForm" autocomplete="on">
          <div class="inputs">
            <!-- New Password -->
            <label class="input-wrap password-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="newPassword" placeholder="New Password" required autocomplete="new-password">
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-hide hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </label>

            <!-- Confirm Password -->
            <label class="input-wrap password-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
            </label>

            <!-- Password Strength Bar -->
            <div class="password-meter" id="passwordMeter">
              <div class="meter-bar"><span class="meter-fill" id="meterFill"></span></div>
              <span class="meter-text" id="meterText">Password strength</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button class="sign-in-btn" id="submitBtn" type="submit">
            <span class="btn-text" id="btnText">Reset Password</span>
            <div class="btn-loader hidden" id="btnLoader">
              <span class="spinner"></span>
            </div>
          </button>

          <!-- Back to Login -->
          <div class="options-row" style="margin-top: 20px;">
            <a href="/admin/login" class="forgot-link">← Back to Login</a>
          </div>
        </form>

        <!-- Notification / Toast Feedback -->
        <div class="feedback-toast" id="feedbackToast">
          <span class="toast-icon">✨</span>
          <span class="toast-text" id="toastText">Welcome back! Access granted.</span>
        </div>
      </div>
    </section>
  </main>

  <script src="/lamp-script.js"></script>
  <script>
    // Get email from URL
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email') || '';

    // Password Toggle
    document.getElementById('togglePassword').addEventListener('click', () => {
      const isPass = document.getElementById('newPassword').type === 'password';
      document.getElementById('newPassword').type = isPass ? 'text' : 'password';
      document.querySelector('.eye-show').classList.toggle('hidden', isPass);
      document.querySelector('.eye-hide').classList.toggle('hidden', !isPass);
      playSound('tap');
    });

    // Password Strength
    document.getElementById('newPassword').addEventListener('input', () => {
      const val = document.getElementById('newPassword').value;
      const passwordMeter = document.getElementById('passwordMeter');
      const meterFill = document.getElementById('meterFill');
      const meterText = document.getElementById('meterText');

      if (!val) {
        passwordMeter.classList.remove('active');
        return;
      }

      passwordMeter.classList.add('active');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (score <= 2) {
        meterFill.style.width = '33%';
        meterFill.style.backgroundColor = '#f85149';
        meterText.textContent = 'Weak password';
        meterText.style.color = '#f85149';
      } else if (score <= 4) {
        meterFill.style.width = '66%';
        meterFill.style.backgroundColor = '#e3b341';
        meterText.textContent = 'Moderate password';
        meterText.style.color = '#e3b341';
      } else {
        meterFill.style.width = '100%';
        meterFill.style.backgroundColor = '#3fb950';
        meterText.textContent = 'Strong password';
        meterText.style.color = '#3fb950';
      }
    });

    // Set New Password Form Handler
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');
      const submitBtn = document.getElementById('submitBtn');
      const loginCard = document.getElementById('loginCard');

      if (!newPassword || !confirmPassword) {
        loginCard.classList.add('shake');
        showToast('Please fill in all fields', 'error');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      if (newPassword !== confirmPassword) {
        loginCard.classList.add('shake');
        showToast('Passwords do not match', 'error');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      if (newPassword.length < 6) {
        loginCard.classList.add('shake');
        showToast('Password must be at least 6 characters', 'error');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      btnText.classList.add('hidden');
      btnLoader.classList.remove('hidden');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, newPassword }),
          credentials: 'include'
        });

        const data = await response.json();

        btnText.classList.remove('hidden');
        btnLoader.classList.add('hidden');
        submitBtn.disabled = false;

        if (response.ok) {
          playSound('success');
          showToast('Password reset successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/admin/forgot-password-success.html';
          }, 1500);
        } else {
          loginCard.classList.add('shake');
          showToast(data.message || 'Failed to reset password', 'error');
          setTimeout(() => loginCard.classList.remove('shake'), 500);
        }
      } catch (error) {
        btnText.classList.remove('hidden');
        btnLoader.classList.add('hidden');
        submitBtn.disabled = false;
        loginCard.classList.add('shake');
        showToast('Network error. Please try again.', 'error');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
      }
    });
  </script>
</body>
</html>
